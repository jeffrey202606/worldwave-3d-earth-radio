<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02050c">
  <meta name="description" content="WORLDWAVE — 可深度缩放的高清 3D 地球电台地图，点击绿色坐标点收听全球公开电台直播。">
  <meta name="referrer" content="no-referrer">
  <title>WORLDWAVE — 3D Earth Radio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b1f33' stroke='%2375bf40' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2375bf40'/%3E%3C/svg%3E">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src https: blob:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <style>
    :root{--lw:0px;--rw:0px;
      /* 豆包 B3：全局只保留两套曲线 / 两个时长，杜绝机械匀速感 */
      --ease-in:cubic-bezier(.22,1,.36,1);--ease-out:cubic-bezier(.4,0,1,1);
      --dur-in:240ms;--dur-out:180ms}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02050c;color:#e6f4ff}
    #earth{position:fixed;inset:0;width:100vw;height:100vh;cursor:grab;touch-action:none;outline:none}
    #earth:active{cursor:grabbing}
    #earth:focus-visible{box-shadow:inset 0 0 0 2px rgba(140,220,170,.65)}
    #earth canvas{display:block;width:100%;height:100%}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    #hud{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
         z-index:5;width:min(760px,max(300px,calc(100vw - var(--lw) - var(--rw) - 24px)));display:flex;flex-direction:column;align-items:center;gap:8px;
         font:12px/1.4 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none}
    #tip{color:rgba(218,238,250,.84);font-size:11px;letter-spacing:.03em;text-align:center;
         padding:3px 12px;border-radius:999px;background:rgba(3,10,18,.55);
         border:1px solid rgba(120,180,200,.10);text-shadow:0 1px 5px #000;transition:opacity .25s}
    #hud:hover #tip{opacity:1;color:rgba(220,240,252,.8)}
    #bar{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:999px;
         border:1px solid rgba(120,220,180,.18);background:rgba(4,12,20,.62);
         backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
         box-shadow:0 6px 26px rgba(0,0,0,.35);opacity:.86;transition:opacity .2s}
    #bar:hover,#bar:focus-within{opacity:1}
    #bar .led{width:7px;height:7px;border-radius:50%;flex:none;background:#75bf40}
    #bar[data-mode="error"] .led{background:#ffb86b}
    #bar[data-mode="loading"] .led{background:#8fc7e8;animation:blink 1.1s infinite}
    #bar[data-mode="paused"] .led{background:#9fb0c0}
    @keyframes blink{50%{opacity:.28}}
    #rTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(232,247,255,.9)}
    #rCluster{flex:none;color:rgba(180,214,190,.72);font-size:11px;font-variant-numeric:tabular-nums}
    #bar button{flex:none;min-width:24px;height:24px;padding:0 5px;border-radius:50%;
      border:1px solid rgba(170,225,255,.20);background:rgba(255,255,255,.05);
      color:rgba(228,246,255,.86);font-size:11px;line-height:1;cursor:pointer}
    #bar button:hover{background:rgba(60,120,170,.35);border-color:rgba(170,225,255,.5)}
    #bar button:disabled{opacity:.32;cursor:default}
    #rVol{width:64px;height:16px;flex:none;accent-color:#75bf40;cursor:pointer}
    #bar input[type=range]:focus-visible,#bar button:focus-visible,#q:focus-visible{outline:2px solid #8fc7e8;outline-offset:2px}
    #search{width:100%;border-radius:14px;border:1px solid rgba(120,220,180,.22);
      background:rgba(4,12,20,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
    #q{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:9px;
      border:1px solid rgba(170,225,255,.22);background:rgba(255,255,255,.06);color:#eaf7ff;
      font:13px/1.4 inherit;outline:none}
    #results{max-height:210px;overflow:auto;margin-top:6px}
    #results button{display:block;width:100%;text-align:left;padding:6px 9px;border:0;border-radius:7px;
      background:transparent;color:rgba(228,246,255,.86);font:12px/1.35 inherit;cursor:pointer}
    #results button:hover,#results button:focus-visible{background:rgba(90,160,200,.22);outline:none}
    #results small{color:rgba(170,205,225,.6);margin-left:6px}
    #rInfo{padding:4px 4px 0;color:rgba(170,205,225,.62);font-size:11px}
    #credit{color:rgba(190,215,230,.52);font-size:10px;text-align:center;text-shadow:0 1px 4px #000}

    /* ===== 两侧电台面板 ===== */
    .panel{position:fixed;top:0;bottom:0;width:296px;z-index:8;display:flex;flex-direction:column;
      /* 豆包 B1：背景压低不透明度、提高 blur，避免「贴了磨砂塑料膜」的厚塑料感；
         没有砍到 0.08 —— 3D 地球是亮贴图，过低会让文字完全不可读 */
      background:linear-gradient(180deg,rgba(8,16,26,.90),rgba(5,12,20,.92));
      backdrop-filter:blur(28px) saturate(120%);-webkit-backdrop-filter:blur(28px) saturate(120%);
      box-shadow:0 0 40px rgba(0,0,0,.45);transition:transform var(--dur-in) var(--ease-in);color:rgba(228,244,255,.9);
      font:12px/1.45 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    /* 收起用退场曲线，展开用入场曲线 */
    #leftPanel,#rightPanel{border-top:1px solid rgba(255,255,255,.07)}
    body[data-left="0"] #leftPanel,body[data-right="0"] #rightPanel{transition:transform var(--dur-out) var(--ease-out)}
    /* 左上角播放器已按用户截图改到右上角：竖向卡片，圆形唱片在上 */
    #leftPanel{left:0;border-right:1px solid rgba(120,220,180,.16)}
    #bar{display:none}
    body[data-left="0"] #leftPanel{transform:translateX(-100%)}
    body[data-right="0"] #rightPanel{transform:translateX(100%)}
    .phead{display:flex;align-items:center;gap:6px;padding:12px 10px 8px;flex:none;
      border-bottom:1px solid rgba(150,200,220,.10)}
    .phead b{font-size:12px;font-weight:600;color:rgba(220,242,255,.92);white-space:nowrap}
    .pcrumb{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
    .pcrumb button{border:0;background:transparent;color:rgba(170,210,230,.66);font:11px inherit;
      padding:2px 3px;cursor:pointer;border-radius:4px;max-width:92px;overflow:hidden;text-overflow:ellipsis}
    .pcrumb button:last-child{color:rgba(225,245,255,.95)}
    .pcrumb button:hover{background:rgba(90,160,200,.2);color:#fff}
    .pcrumb span{color:rgba(150,190,210,.4)}
    .phead button.ico{flex:none;width:24px;height:24px;padding:0;border-radius:6px;
      border:1px solid rgba(160,210,230,.18);background:rgba(255,255,255,.04);
      color:rgba(220,240,255,.8);cursor:pointer;font-size:12px;line-height:1}
    .phead button.ico:hover{background:rgba(60,120,170,.35)}
    .phead button.ico:disabled{opacity:.3;cursor:default}
    .psearch{flex:none;padding:8px 10px;border-bottom:1px solid rgba(150,200,220,.10)}
    .psearch input{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:8px;
      border:1px solid rgba(160,210,230,.18);background:rgba(255,255,255,.05);color:#eaf7ff;
      font:12px inherit;outline:none;transition:border-color .15s,box-shadow .15s}
    .psearch input:focus{border-color:rgba(117,191,64,.6);box-shadow:0 0 0 3px rgba(117,191,64,.10)}
    .pbody{flex:1;overflow:auto;padding:8px 10px 14px;scrollbar-width:thin;
      scrollbar-color:rgba(120,180,200,.3) transparent;overscroll-behavior:contain}
    .pbody::-webkit-scrollbar{width:6px}
    .pbody::-webkit-scrollbar-thumb{background:rgba(120,180,200,.28);border-radius:3px}
    .psec{position:sticky;top:-1px;z-index:3;margin:0 0 7px;padding:9px 2px 7px;
      background:rgba(6,15,26,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      color:rgba(176,220,236,.86);font-size:10.5px;letter-spacing:.08em;font-weight:600}
    .psec::after{content:'';display:block;margin-top:5px;height:1px;width:32px;
      background:linear-gradient(90deg,rgba(150,215,180,.6),rgba(120,180,200,0))}

    /* 顶部统计卡 */
    .pstats{display:flex;gap:7px;margin:4px 0 10px}
    .pstat{flex:1;border:1px solid rgba(150,200,220,.12);border-radius:10px;padding:9px 4px 7px;
      text-align:center;background:rgba(255,255,255,.028)}
    .pstat b{display:block;font-size:15px;font-weight:600;color:rgba(235,248,255,.95);
      font-variant-numeric:tabular-nums;letter-spacing:.02em}
    .pstat span{font-size:10px;color:rgba(160,195,215,.55)}

    /* 卡片与行 */
    .pcard,.prow{width:100%;box-sizing:border-box;border:1px solid rgba(150,200,220,.10);
      background:rgba(255,255,255,.028);border-radius:10px;padding:8px 9px;margin-bottom:5px;
      text-align:left;color:rgba(228,244,255,.88);font:12px inherit;cursor:pointer;font-variant-numeric:tabular-nums;
      display:flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s}
    .pcard:hover,.prow:hover{background:rgba(90,160,200,.18);border-color:rgba(140,210,170,.35);
      transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.22)}
    .pcard:active,.prow:active{transform:translateY(0)}
    .pcard:focus-visible,.prow:focus-visible,.phead button:focus-visible,.ptab:focus-visible,
      .pfav:focus-visible,.nbtn:focus-visible,.pmore:focus-visible,.seg button:focus-visible{outline:2px solid #8fc7e8;outline-offset:1px}
    .pcard .ico{flex:none;width:26px;height:26px;border-radius:8px;display:inline-flex;
      align-items:center;justify-content:center;background:rgba(255,255,255,.05);font-size:13px}
    .prow .ico{font-size:14px;flex:none;width:16px;text-align:center}
    /* 大洲 / 功能配色（低饱和） */
    .c-gn{color:#75bf40}.c-as{color:#e0b26a}.c-eu{color:#8fc7e8}.c-af{color:#e0956e}
    .c-na{color:#9dd39d}.c-sa{color:#c7a5e0}.c-oc{color:#7ad4d0}.c-an{color:#b8d8f0}
    .c-yl{color:#ffd257}.c-ot{color:#9fb0c0}
    .pmain{flex:1;min-width:0}
    .pname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
    .pmeta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-size:10px;color:rgba(165,200,220,.58);margin-top:1px}
    .pbadge{flex:none;min-width:22px;text-align:center;padding:1px 5px;border-radius:20px;
      background:rgba(117,191,64,.14);color:rgba(170,225,135,.9);font-size:10px;font-variant-numeric:tabular-nums}
    .pdot{flex:none;width:7px;height:7px;border-radius:50%;background:#75bf40;
      box-shadow:0 0 0 3px rgba(117,191,64,.12)}

    /* 播放中：均衡器动画 */
    .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;width:14px;flex:none}
    .eq i{flex:1;background:#75bf40;border-radius:1px;animation:eqbar 1s ease-in-out infinite}
    .eq i:nth-child(2){animation-delay:.22s}
    .eq i:nth-child(3){animation-delay:.44s}
    @keyframes eqbar{0%,100%{height:3px}50%{height:12px}}
    @media (prefers-reduced-motion:reduce){.eq i{animation:none;height:6px}}
    .prow.on{border-color:rgba(117,191,64,.55);background:rgba(117,191,64,.12)}
    .prow.on:hover{box-shadow:0 4px 14px rgba(0,0,0,.22)}

    /* 行内快速收藏 */
    .pfav{flex:none;width:24px;height:24px;padding:0;border-radius:6px;border:0;
      background:transparent;color:rgba(185,215,235,.55);font-size:13px;cursor:pointer;line-height:1;
      transition:color .15s,background .15s}
    .prow:hover .pfav,.prow:focus-within .pfav{color:rgba(220,240,255,.8)}
    .pfav.on{color:#ffd257}
    .pfav:hover{background:rgba(255,210,87,.16);color:#ffd257}

    .pempty{padding:20px 10px;text-align:center;color:rgba(165,200,220,.55);font-size:11px;line-height:1.7}
    .pempty .eico{font-size:22px;color:rgba(117,191,64,.55);margin-bottom:6px}
    .pmore{width:100%;padding:7px;border-radius:8px;border:1px dashed rgba(150,200,220,.22);
      background:transparent;color:rgba(180,215,235,.72);font:11px inherit;cursor:pointer;margin-top:4px;
      transition:background .15s,border-color .15s}
    .pmore:hover{background:rgba(90,160,200,.15);border-color:rgba(140,210,170,.35)}
    .pfoot{flex:none;padding:7px 10px;border-top:1px solid rgba(150,200,220,.10);
      color:rgba(160,195,215,.5);font-size:10px;display:flex;justify-content:space-between;align-items:center}
    #rState::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
      margin-right:5px;background:#75bf40;vertical-align:1px}
    #rState[data-mode="error"]::before{background:#ffb86b}
    #rState[data-mode="loading"]::before{background:#8fc7e8;animation:blink 1.1s infinite}
    #rState[data-mode="paused"]::before{background:#9fb0c0}
    .ptab{position:fixed;top:50%;z-index:9;transform:translateY(-50%);
      padding:10px 7px;width:26px;border:1px solid rgba(120,220,180,.25);
      background:rgba(5,13,23,.82);backdrop-filter:blur(10px);color:rgba(210,238,225,.85);
      font:11px/1.3 inherit;cursor:pointer;writing-mode:vertical-rl;letter-spacing:.12em;
      transition:left .3s ease,right .3s ease,background .15s}
    #leftTab{left:var(--lw);border-left:0;border-radius:0 8px 8px 0}
    #rightTab{right:var(--rw);border-right:0;border-radius:8px 0 0 8px}
    body[data-left="1"] #leftTab,body[data-right="1"] #rightTab{display:none}
    .ptab:hover{background:rgba(60,120,170,.4)}

    /* 当前播放 hero 卡 */
    .nhero{border:1px solid rgba(117,191,64,.28);border-radius:12px;padding:13px;margin:2px 0 10px;
      background:linear-gradient(155deg,rgba(30,70,45,.45),rgba(8,20,32,.55));
      box-shadow:0 6px 24px rgba(0,0,0,.28)}
    .nchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
      border:1px solid rgba(117,191,64,.35);background:rgba(117,191,64,.10);
      color:rgba(190,230,180,.9);font-size:10px;letter-spacing:.06em}
    .nchip .eq{height:9px;width:11px}
    .nchip .eq i{background:rgba(190,230,180,.9)}
    .nname{font-size:15px;font-weight:600;margin:8px 0 3px;color:#f0f8ff;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nmeta{font-size:11px;color:rgba(175,210,225,.7);line-height:1.6;word-break:break-all}
    .ncoords{margin-top:2px;font:11px ui-monospace,Consolas,"Courier New",monospace;
      color:rgba(150,205,225,.55);letter-spacing:.03em}
    .nactions{display:flex;gap:6px;margin-top:11px}
    .nbtn{flex:1;min-width:40px;padding:6px 4px;border-radius:8px;
      border:1px solid rgba(160,210,230,.2);background:rgba(255,255,255,.05);
      color:rgba(228,244,255,.88);font:11px inherit;cursor:pointer;
      transition:background .15s,border-color .15s}
    .nbtn:hover{background:rgba(60,120,170,.35)}
    .nbtn.primary{flex:1;min-width:96px;background:linear-gradient(180deg,rgba(117,191,64,.30),rgba(117,191,64,.14));
      border-color:rgba(117,191,64,.5);color:#cdefa0;font-weight:600}
    .nbtn.primary:hover{background:linear-gradient(180deg,rgba(117,191,64,.42),rgba(117,191,64,.20))}
    .nbtn.icon{flex:none;width:32px;min-width:32px;padding:0;height:29px;font-size:13px;line-height:1;
      color:rgba(200,228,240,.82)}
    .nbtn.on{border-color:rgba(255,210,87,.5);color:#ffd257;background:rgba(255,210,87,.10)}

    /* 设置行 */
    .setrow{display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:9px 2px;border-bottom:1px solid rgba(150,200,220,.08)}
    .setrow span{font-size:11px;color:rgba(215,238,250,.86)}
    .setrow small{display:block;font-size:10px;color:rgba(160,195,215,.5);margin-top:2px}
    .seg{display:flex;flex:none;border:1px solid rgba(160,210,230,.18);border-radius:7px;overflow:hidden;
      background:rgba(255,255,255,.03)}
    .seg button{border:0;background:transparent;color:rgba(190,220,235,.7);
      font:10px inherit;padding:4px 8px;cursor:pointer;transition:background .15s,color .15s}
    .seg button+button{border-left:1px solid rgba(160,210,230,.12)}
    .seg button.on{background:rgba(117,191,64,.22);color:#c8ec9f}
    .volrow{display:flex;align-items:center;gap:8px;padding:4px 0}
    .volrow input[type=range]{flex:1;accent-color:#75bf40;cursor:pointer}
    .volval{flex:none;min-width:34px;text-align:right;color:rgba(200,230,245,.8);
      font-size:11px;font-variant-numeric:tabular-nums}
    .kv{display:flex;justify-content:space-between;padding:4px 2px;font-size:11px;
      color:rgba(175,210,225,.72);border-bottom:1px dashed rgba(150,200,220,.08)}
    .kv b{font-weight:500;color:rgba(225,245,255,.9);font-variant-numeric:tabular-nums}

    /* 浮层提示 */
    #wwToast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));
      transform:translate(-50%,10px);z-index:20;padding:8px 18px;border-radius:999px;
      border:1px solid rgba(117,191,64,.4);background:rgba(6,16,26,.94);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      color:rgba(232,247,255,.95);font:12px/1.4 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;
      transition:opacity .25s,transform .25s;white-space:nowrap;max-width:80vw;
      overflow:hidden;text-overflow:ellipsis}
    #wwToast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:980px){.panel{width:min(84vw,300px)}}
    @media (prefers-reduced-motion:reduce){.panel,.ptab{transition:none}#wwToast{transition:opacity .15s}}
    .ww-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;padding:24px;color:#b8ccdc;font:14px/1.6 system-ui,sans-serif;text-align:center;overflow:auto}
    .ww-fallback img{width:min(760px,92vw);border-radius:12px;opacity:.85}
    .ww-fallback .list{width:min(760px,92vw);max-height:34vh;overflow:auto;text-align:left;
      border:1px solid rgba(160,200,220,.2);border-radius:10px;padding:8px}
    .ww-fallback .list button{display:block;width:100%;text-align:left;border:0;background:transparent;
      color:#cfe6f5;padding:5px 8px;cursor:pointer;border-radius:6px;font:12px system-ui,sans-serif}
    .ww-fallback .list button:hover{background:rgba(90,160,200,.2)}
    @media (max-width:560px){#tip{font-size:10px}#rVol{width:44px}#credit{display:none}}
    @media (prefers-reduced-motion:reduce){#bar[data-mode="loading"] .led{animation:none}#tip,#bar{transition:none}}

    /* ===== 分类标签 chips：独立固定栏，列表滚动时保持固定 ===== */
    .pfilters{flex:none;padding:8px 10px 0;border-bottom:1px solid rgba(150,200,220,.1)}
    .pfilters[hidden]{display:none}
    #lBody{padding-top:0}
    .pcap{font-size:10px;color:rgba(170,205,225,.5);letter-spacing:.04em;padding:8px 4px 6px}
    .pcap.dim{color:rgba(150,190,210,.4);padding-top:0;margin-bottom:4px}
    .chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 8px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none;border:1px solid rgba(150,200,220,.16);background:rgba(255,255,255,.03);
      color:rgba(212,238,250,.78);font-size:10.5px;line-height:1;font-family:inherit;
      padding:4px 8px;border-radius:999px;cursor:pointer;
      white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .12s}

    /* A1：首屏只露 6 个地区 chip，其余 11 个折叠成「+11」；

    /* 视图切换：内容区 x 偏移 16px 淡入，200ms ease-out */

    /* ===== 电台卡片（重设计：徽标 / 双行文本 / 浮层操作） ===== */
    .prow.acard{position:relative;align-items:center;gap:9px;min-height:56px;
      padding:8px 9px;margin-bottom:6px;
      /* B1：取消全边白描边，改成「顶部受光 / 底部阴影」的物理层次；圆角收敛到 10px */
      border-radius:10px;border:1px solid rgba(255,255,255,.04);
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.016));
      box-shadow:0 1px 0 rgba(255,255,255,.075) inset,0 -1px 0 rgba(0,0,0,.20) inset,0 1px 2px rgba(0,0,0,.16);
      overflow:hidden;transition:transform var(--dur-out) var(--ease-out),border-color .16s,box-shadow .16s,background .18s}
    .prow.acard::before{content:'';position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;

    /* 键盘焦点：用品牌绿描边并外扩 2px，不改变卡片尺寸，避免列表跳动 */
    .prow.acard:focus-visible{outline:2px solid rgba(165,232,116,.75);outline-offset:2px;
      border-color:rgba(165,232,116,.4)}
    .prow.acard:focus-visible .alogo{box-shadow:0 0 0 1.5px rgba(165,232,116,.45),0 2px 7px rgba(0,0,0,.28)}
    .prow.acard.on{border-color:rgba(117,191,64,.30);
      background:linear-gradient(180deg,rgba(117,191,64,.105),rgba(117,191,64,.032))}
    .prow.acard.on::before{background:linear-gradient(180deg,#a5e874,#5aa32c);
      box-shadow:0 0 12px rgba(117,191,64,.5)}
    .prow.acard.on .alogo{box-shadow:0 0 0 1.5px rgba(117,191,64,.5),0 2px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.35) inset}
    /* 点击后到出声之间：卡片立即进入「连接中」，底部一条不定进度条给出即时确认 */
    .prow.acard.connecting{border-color:rgba(143,199,232,.34);
      background:linear-gradient(180deg,rgba(143,199,232,.10),rgba(143,199,232,.028))}
    .prow.acard.on.connecting{border-color:rgba(143,199,232,.4)}
    .prow.acard.connecting::before{background:linear-gradient(180deg,#9fd8f2,#5e9fc4);
      box-shadow:0 0 10px rgba(143,199,232,.45)}
    .prow.acard .cprog{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden;
      background:rgba(143,199,232,.14);transition:opacity .18s ease}
    .prow.acard .cprog::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:40%;
      background:linear-gradient(90deg,rgba(143,199,232,0),#9fd8f2,rgba(143,199,232,0));
      animation:cslide 1.2s cubic-bezier(.4,0,.6,1) infinite}

    /* 从地球点选后的落点提示：短暂描边呼吸，告诉用户「就是这张」 */
    .prow.acard.flash{animation:cflash 1.6s ease-out 1}
    @keyframes cflash{
      0%{box-shadow:0 0 0 0 rgba(165,232,116,.55),0 1px 0 rgba(255,255,255,.055) inset}

    /* 触屏：没有 hover，定位按钮常驻，长按另有操作单 */

    .sdrawer.on{animation:sdIn var(--dur-in) var(--ease-in) both}
    .sdrawer.out{animation:sdOut var(--dur-out) var(--ease-out) both}

    /* 体检判定不可用的流：压暗但仍可点击（可能只是当时不可达） */
    /* 体检判定上次没连上：只压暗徽标与站名，具体原因放在 title 里，避免挤占文字 */
    .prow.acard.dead .pname{opacity:.7}
    .prow.acard.dead .alogo{filter:grayscale(.7);opacity:.7}

    /* ===== 右上角一体化播放器 =====
       按用户红框：right 16 / top 36、280×355 竖向卡片，圆形唱片置顶居中。
       右栏卡片移除后，这里是唯一的播放入口。 */
    .wwpl{position:fixed;right:16px;top:36px;width:280px;height:355px;z-index:30;border-radius:18px;
      box-sizing:border-box;display:flex;flex-direction:column;border:1px solid transparent;overflow:hidden;
      background:linear-gradient(180deg,rgba(20,28,40,.93),rgba(9,15,24,.95)) padding-box,
        linear-gradient(135deg,rgba(165,232,116,.5),rgba(90,180,220,.16) 46%,rgba(255,255,255,.05)) border-box;
      backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);
      box-shadow:0 18px 44px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.09);
      color:rgba(232,246,255,.92);font:12px/1.45 inherit}
    /* 不给 height 加过渡：Chromium 无法在 355px 与 min()/calc() 数学表达式之间插值，
       会把过渡卡在起始值，导致展开面板永远不长大。面板自身的 plPanelIn 已提供入场动效。 */
    .wwpl.open{height:min(660px,calc(100vh - 56px))}
    /* 缓慢旋转的极光光晕，只在有内容时轻微呼吸 */
    .wwpl-aura{position:absolute;left:-40%;top:-160%;width:180%;height:320%;pointer-events:none;
      background:conic-gradient(from 0deg,rgba(124,201,79,.16),rgba(70,150,210,.10),rgba(0,0,0,0) 62%,rgba(124,201,79,.12));
      filter:blur(28px);opacity:.55;animation:plAura 18s linear infinite}
    @keyframes plAura{to{transform:rotate(360deg)}}
    /* 竖版主区：唱片 → 台名/状态 → 频谱 → 按钮，均等分布填满卡片 */
    .wwpl-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
      align-items:center;justify-content:space-evenly;gap:0;padding:14px 16px 12px;box-sizing:border-box}
    .wwpl.open .wwpl-main{flex:none;justify-content:flex-start;gap:10px;padding:12px 14px 10px}
    /* 黑胶唱片：播放时旋转，暂停时定格；图标反向自转保持正立 */
    .wwpl-disc{position:relative;flex:none;width:150px;height:150px;border-radius:50%;padding:0;border:0;cursor:pointer;
      background:repeating-radial-gradient(circle at 50% 50%,#111820 0 2px,#0a1017 2px 3px,#151d27 3px 4px);
      box-shadow:0 0 0 1px rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.55),0 0 30px rgba(124,201,79,.08);
      animation:plSpin 5.5s linear infinite;animation-play-state:paused}
    .wwpl.open .wwpl-disc{width:96px;height:96px}
    .wwpl[data-mode="playing"] .wwpl-disc,
    .wwpl[data-mode="loading"] .wwpl-disc{animation-play-state:running}
    @keyframes plSpin{to{transform:rotate(360deg)}}
    .wwpl-disc-ring{position:absolute;inset:7%;border-radius:50%;border:1px solid rgba(165,232,116,.20);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 26px rgba(124,201,79,.07)}
    .wwpl-disc-core{position:absolute;inset:29%;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#c8f39e,#75bf40 55%,#2f6d1c);
      box-shadow:0 0 22px rgba(124,201,79,.45)}
    .wwpl-disc-ico{position:absolute;inset:39%;display:flex;align-items:center;justify-content:center;color:#12200c;
      animation:plSpin 5.5s linear infinite reverse;animation-play-state:paused}
    .wwpl[data-mode="playing"] .wwpl-disc-ico,
    .wwpl[data-mode="loading"] .wwpl-disc-ico{animation-play-state:running}
    .wwpl-disc-ico svg{width:100%;height:100%}
    .wwpl-txt{position:relative;flex:none;width:100%;text-align:center}
    .wwpl-name{font-size:16px;font-weight:600;line-height:1.4;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      background:linear-gradient(90deg,#f2fbff,#b9e6a0);-webkit-background-clip:text;background-clip:text;color:transparent}
    .wwpl-sub{display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:rgba(184,212,230,.6);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wwpl-sub i{flex:none;width:3px;height:3px;border-radius:50%;background:rgba(184,212,230,.4)}
    .wwpl-sub span:last-child{overflow:hidden;text-overflow:ellipsis}
    .wwpl[data-mode="playing"] #plState{color:#b7e890}
    .wwpl[data-mode="error"] #plState{color:#ffb86b}
    /* 频谱：播放时律动，暂停时静止 */
    .wwpl-eqviz{position:relative;flex:none;display:flex;align-items:flex-end;justify-content:center;
      gap:4px;height:22px;width:100%;opacity:.5}
    .wwpl .wwpl-eqviz i{width:5px;height:var(--h,9px);border-radius:2px;
      background:linear-gradient(180deg,#b7e890,#4f9b2a);
      animation:plEq .8s ease-in-out infinite alternate;animation-delay:var(--d,0s);animation-play-state:paused}
    .wwpl[data-mode="playing"] .wwpl-eqviz{opacity:1}
    .wwpl[data-mode="playing"] .wwpl-eqviz i{animation-play-state:running}
    @keyframes plEq{from{transform:scaleY(.42)}to{transform:scaleY(1.18)}}
    /* 连接中也保持律动，避免「点了播放却像没反应」的空窗 */
    .wwpl[data-mode="loading"] .wwpl-eqviz{opacity:1}
    .wwpl[data-mode="loading"] .wwpl-eqviz i,
    .wwpl[data-mode="loading"] .eqviz i{animation-play-state:running}
    .wwpl-btns{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;flex:none;width:100%}
    .wwpl-b{width:30px;height:30px;padding:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);color:rgba(222,240,252,.78);
      cursor:pointer;font:14px/1 inherit;transition:background .15s,border-color .15s,color .15s,transform .12s}
    .wwpl-b:hover{background:rgba(90,160,200,.24);border-color:rgba(160,215,240,.36);color:#fff}
    .wwpl-b:active{transform:translateY(1px)}
    .wwpl-b svg{width:16px;height:16px}
    .wwpl-b.primary{width:42px;height:42px;border-radius:50%;color:#10200a;
      background:linear-gradient(160deg,#c8f39e,#75bf40 60%,#4f9b2a);border-color:rgba(200,243,158,.7);
      box-shadow:0 0 0 4px rgba(124,201,79,.10),0 4px 14px rgba(124,201,79,.28)}
    .wwpl-b.primary:hover{background:linear-gradient(160deg,#dcffb8,#8ad455 60%,#5aaf30);color:#10200a}
    .wwpl-b.primary svg{width:20px;height:20px}
    .wwpl[data-mode="playing"] .wwpl-b.primary{animation:plGlow 2.2s ease-in-out infinite}
    @keyframes plGlow{50%{box-shadow:0 0 0 7px rgba(124,201,79,.14),0 6px 20px rgba(124,201,79,.42)}}
    .wwpl-b.more{font-size:17px;line-height:1}
    .wwpl.open .wwpl-b.more{transform:rotate(180deg)}
    /* 底部流动光带 */
    .wwpl-track{position:relative;flex:none;height:2px;background:rgba(255,255,255,.05);overflow:hidden}
    .wwpl-track span{position:absolute;top:0;left:-45%;width:45%;height:100%;
      background:linear-gradient(90deg,transparent,#a5e874,rgba(120,200,230,.8),transparent);
      animation:plSweep 3.4s linear infinite}
    @keyframes plSweep{to{left:100%}}
    /* 展开的多功能面板：吃掉剩余高度，内部滚动，不再顶出卡片 */
    .wwpl-panel{position:relative;flex:1;min-height:0;padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,.07);
      animation:plPanelIn var(--dur-in) var(--ease-in) both;overflow:auto;overscroll-behavior:contain}
    @keyframes plPanelIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    .plrow{margin-bottom:10px}
    .plrow-t{display:flex;align-items:center;justify-content:space-between;font-size:10px;
      letter-spacing:.08em;color:rgba(176,210,228,.55);margin-bottom:6px}
    .plrow-t b{font-size:11px;font-weight:400;color:rgba(220,240,252,.82);font-variant-numeric:tabular-nums}
    .plchips{display:flex;flex-wrap:wrap;gap:5px}
    .plchip{flex:none;padding:5px 9px;border-radius:8px;cursor:pointer;font:10.5px/1 inherit;
      border:1px solid rgba(150,200,220,.18);background:rgba(255,255,255,.035);color:rgba(214,236,248,.76);
      transition:background .15s,border-color .15s,color .15s}
    .plchip:hover{background:rgba(90,160,200,.22);color:#fff}
    .plchip.on{background:linear-gradient(180deg,rgba(124,201,79,.30),rgba(124,201,79,.13));
      border-color:rgba(124,201,79,.55);color:#dcf5c2}
    .plchip svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
    .plvol{display:flex;align-items:center;gap:8px}
    .plvol input{flex:1;accent-color:#a5e874;cursor:pointer}
    .plvol span{font-size:10.5px;color:rgba(200,226,240,.7);width:34px;text-align:right;font-variant-numeric:tabular-nums}
    .eqviz{display:flex;align-items:flex-end;gap:3px;height:26px;margin:2px 0 8px}
    .eqviz i{width:6px;height:var(--h,9px);border-radius:2px;
      background:linear-gradient(180deg,#a5e874,#3f7f22);opacity:.85;
      animation:plEq .8s ease-in-out infinite alternate;animation-delay:var(--d,0s);animation-play-state:paused}
    .wwpl[data-mode="playing"] .eqviz i{animation-play-state:running}
    .sleepdisp{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;
      color:rgba(176,210,228,.6);margin-top:6px}
    .sleepdisp b{font-weight:400;font-size:13px;color:#dff5c8;font-variant-numeric:tabular-nums;letter-spacing:.04em}
    .sleepdisp b[data-fade="1"]{color:#ffb86b}
    .plgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
    .plgrid .plchip{text-align:center;padding:7px 4px}
    .plnote{font-size:10px;color:rgba(160,195,215,.5);line-height:1.5;margin:2px 0 0}
    .plrescue{margin-top:8px}
    @media (max-width:700px){
      .wwpl{right:8px;left:auto;top:8px;width:212px;height:300px}
      .wwpl.open{height:min(560px,calc(100vh - 24px))}
      .wwpl-disc{width:112px;height:112px}
      .wwpl.open .wwpl-disc{width:72px;height:72px}
      .wwpl-name{font-size:14px}
    }
    @media (prefers-reduced-motion:reduce){
      .wwpl-aura,.wwpl-disc,.wwpl-disc-ico,.wwpl-eqviz i,.eqviz i,.wwpl-track span,.wwpl-b.primary{animation:none}}

    /* ===== 中间底部：实时语音内容翻译框（替代旧播放条的可见区域） ===== */
    #wwTrans{position:relative;width:100%;box-sizing:border-box;border-radius:14px;
      border:1px solid rgba(120,220,180,.20);
      background:linear-gradient(180deg,rgba(8,18,28,.88),rgba(4,10,18,.93));
      backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);
      box-shadow:0 10px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
      overflow:hidden;user-select:text;color:rgba(232,247,255,.9)}
    #wwTrans.folded .trbody,#wwTrans.folded .trfoot,#wwTrans.folded .trnote{display:none}
    .trhead{display:flex;align-items:center;gap:8px;padding:7px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
    #wwTrans.folded .trhead{border-bottom:0}
    .trdot{flex:none;width:8px;height:8px;border-radius:50%;background:#5b7183;
      box-shadow:0 0 0 3px rgba(120,150,170,.10)}
    #wwTrans[data-state="listening"] .trdot{background:#a5e874;
      box-shadow:0 0 0 3px rgba(124,201,79,.16),0 0 12px rgba(124,201,79,.7);
      animation:trPulse 1.4s ease-in-out infinite}
    #wwTrans[data-state="translating"] .trdot{background:#8fc7e8;box-shadow:0 0 0 3px rgba(143,199,232,.18)}
    #wwTrans[data-state="error"] .trdot{background:#ffb86b;box-shadow:0 0 0 3px rgba(255,184,107,.16)}
    @keyframes trPulse{50%{opacity:.42}}
    .trtitle{flex:none;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgba(226,246,255,.92)}
    .trstation{flex:none;max-width:148px;overflow:hidden;text-overflow:ellipsis;
      font-size:10px;color:rgba(165,205,225,.55)}
    .trstat{flex:none;font-size:10px;padding:2px 7px;border-radius:999px;
      background:rgba(255,255,255,.05);color:rgba(190,220,238,.72)}
    .trwave{flex:none;display:flex;align-items:center;gap:2px;height:14px;opacity:.4}
    .trwave i{display:block;width:2px;height:var(--h,6px);border-radius:1px;background:#9ddc78}
    #wwTrans[data-state="listening"] .trwave{opacity:1}
    #wwTrans[data-state="listening"] .trwave i{animation:trEq .7s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
    @keyframes trEq{from{transform:scaleY(.4)}to{transform:scaleY(1.5)}}
    .trgrow{flex:1;min-width:4px}
    .trsel{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(170,205,225,.55)}
    .trsel select,.trengsel{flex:none;font:10.5px/1 inherit;padding:4px 5px;border-radius:6px;
      border:1px solid rgba(150,200,220,.22);background:rgba(9,20,30,.92);color:#dbf2ff;
      outline:none;cursor:pointer;max-width:132px}
    .trsel select:focus-visible,.trengsel:focus-visible,.trbtn:focus-visible,.trinput:focus-visible{outline:2px solid #8fc7e8;outline-offset:1px}
    .trbtn{flex:none;padding:4px 9px;border-radius:8px;cursor:pointer;font:10.5px/1.2 inherit;
      border:1px solid rgba(150,200,220,.22);background:rgba(255,255,255,.045);color:rgba(222,240,252,.82);
      transition:background .15s,border-color .15s}
    .trbtn:hover{background:rgba(90,160,200,.24);border-color:rgba(160,215,240,.42)}
    .trbtn.primary{background:linear-gradient(160deg,rgba(165,232,116,.30),rgba(117,191,64,.16));
      border-color:rgba(165,232,116,.5);color:#dcf5c2}
    .trbtn.primary:hover{background:linear-gradient(160deg,rgba(165,232,116,.46),rgba(117,191,64,.26))}
    .trbtn.mini{padding:4px 7px;font-size:12px;line-height:1}
    .trbody{height:120px;overflow:auto;overscroll-behavior:contain;padding:8px 12px;
      scrollbar-width:thin;scrollbar-color:rgba(140,190,215,.25) transparent}
    .trempty{font-size:11px;line-height:1.7;color:rgba(170,205,225,.62)}
    .trempty b{color:rgba(200,236,255,.88);font-weight:600}
    .trline{padding:4px 0 5px;border-bottom:1px solid rgba(255,255,255,.045);
      animation:trIn var(--dur-in) var(--ease-in) both}
    .trline:last-child{border-bottom:0}
    @keyframes trIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .trorig{font-size:10.5px;color:rgba(170,205,225,.62);line-height:1.5;word-break:break-word}
    .trtrans{font-size:13.5px;line-height:1.5;color:#e9f8ff;margin-top:2px;word-break:break-word}
    .trtrans.pending{color:rgba(160,195,215,.5);font-size:12px;font-style:italic}
    .trtrans.fail{color:#ffb86b;font-size:12px}
    .trmeta{font-size:9px;color:rgba(150,190,210,.42);margin-top:3px}
    .trinterim{font-size:12px;color:rgba(185,220,240,.55);font-style:italic;padding:3px 0}
    .trfoot{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid rgba(255,255,255,.06)}
    .trinput{flex:1;min-width:0;padding:5px 8px;border-radius:7px;font:11px/1.3 inherit;
      border:1px solid rgba(150,200,220,.18);background:rgba(255,255,255,.04);color:#eaf7ff;outline:none}
    .trinput::placeholder{color:rgba(160,195,215,.45)}
    .trengine{flex:0 1 auto;min-width:0;max-width:96px;overflow:hidden;text-overflow:ellipsis;
      font-size:9.5px;color:rgba(160,195,215,.5);white-space:nowrap}
    .trnote{padding:0 12px 8px;font-size:9.5px;line-height:1.5;color:rgba(150,190,210,.42)}
    @media (max-width:700px){
      .trhead{flex-wrap:wrap;white-space:normal}
      .trstation,.trwave,.trnote{display:none}
      .trbody{height:82px}
      .trengine{display:none}
    }
    @media (prefers-reduced-motion:reduce){#wwTrans[data-state="listening"] .trdot,
      #wwTrans[data-state="listening"] .trwave i,.trline{animation:none}}

  </style>

<body>
  <div id="earth" role="application" tabindex="0"
       aria-label="高清 3D 地球电台地图。拖拽旋转，滚轮缩放，点击绿色圆点播放公开电台；按斜杠键搜索电台或城市。"></div>

  <div id="hud">
    <div id="tip">拖拽旋转 · 滚轮缩放 · 点击绿点播放 · <b>/</b> 搜索 · <b>F</b> 影院模式 · <b>Esc</b> 停止</div>
    <div id="bar" data-mode="idle">
      <span class="led" aria-hidden="true"></span>
      <span id="rTitle">正在加载…</span>
      <span id="rCluster" hidden></span>
      <button id="rPrev" type="button" title="同一位置的上一台" aria-label="上一台" disabled>‹</button>
      <button id="rToggle" type="button" title="播放 / 暂停" aria-label="播放或暂停" disabled>▶</button>
      <button id="rNext" type="button" title="同一位置的下一台" aria-label="下一台" disabled>›</button>
      <input id="rVol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="音量">
      <button id="rStop" type="button" title="停止播放" aria-label="停止播放" disabled>■</button>
      <button id="rSearch" type="button" title="搜索电台或城市（/）" aria-label="搜索电台">⌕</button>
    </div>
    <!-- 实时语音内容翻译框：可见区域已完全取代上面的旧播放条。
         旧 #bar 仅保留为隐藏兼容节点（earth.js / panels.js 的 DOM 引用都带空值守卫，且 _iter7 自检会读取它）。 -->
    <div id="wwTrans" data-state="idle" aria-label="实时语音内容翻译">
      <div class="trhead">
        <span class="trdot" aria-hidden="true"></span>
        <span class="trtitle">实时语音翻译</span>
        <span class="trstation" id="trStation">未选择电台</span>
        <span class="trstat" id="trStat">待机</span>
        <span class="trwave" aria-hidden="true">
          <i style="--h:5px;--d:0s"></i><i style="--h:11px;--d:.12s"></i><i style="--h:7px;--d:.24s"></i>
          <i style="--h:13px;--d:.36s"></i><i style="--h:6px;--d:.48s"></i><i style="--h:9px;--d:.6s"></i>
        </span>
        <span class="trgrow"></span>
        <label class="trsel">译入<select id="trTarget" aria-label="翻译目标语言"></select></label>
        <button class="trbtn primary" id="trStart" type="button">开始收音</button>
        <button class="trbtn" id="trClear" type="button" title="清空字幕">清空</button>
        <button class="trbtn mini" id="trFold" type="button" title="折叠 / 展开字幕框" aria-expanded="true">⌄</button>
      </div>
      <div class="trbody" id="trBody" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <div class="trfoot">
        <input class="trinput" id="trInput" type="text" autocomplete="off"
               placeholder="也可粘贴 / 输入一句外语，回车立即翻译" aria-label="手动输入待翻译文本">
        <button class="trbtn" id="trSend" type="button">翻译</button>
        <label class="trsel">音源<select id="trSource" aria-label="语音识别源语言"></select></label>
        <select class="trengsel" id="trEngine" aria-label="翻译引擎"></select>
        <span class="trengine" id="trEngineTag">引擎 —</span>
      </div>
      <div class="trnote">语音识别使用浏览器内置引擎（免费、无需密钥），拾取麦克风 / 系统声音；公开电台流受跨域限制，页面无法直接读取音频 PCM，因此不截断原始音频。文字翻译由免费公共 AI 接口完成，失败自动降级。</div>
    </div>
    <div id="search" hidden>
      <input id="q" type="search" placeholder="搜索电台名称 / 城市 / 国家，回车定位并播放" autocomplete="off" aria-label="搜索电台">
      <div id="results"></div>
      <div id="rInfo"></div>
    </div>
    <div id="credit">影像 © Esri / Maxar / Earthstar Geographics · 电台目录 © Radio Browser 社区</div>
  </div>
  <div id="status" class="sr-only" role="status" aria-live="polite"></div>

  <aside id="leftPanel" class="panel" aria-label="电台目录与分级浏览">
    <div class="phead">
      <button class="ico" id="lBack" type="button" title="返回上一级" aria-label="返回上一级">‹</button>
      <div class="pcrumb" id="lCrumb"></div>
      <button class="ico" id="lCollapse" type="button" title="收起左栏" aria-label="收起左栏">×</button>
    </div>
    <div class="ptabs" id="lTabs" role="tablist" aria-label="视图切换">
      <button class="ptab2 on" data-v="root" type="button" role="tab" aria-selected="true">目录</button>
      <button class="ptab2" data-v="discover" type="button" role="tab" aria-selected="false">发现</button>
    </div>
    <div class="lnow" id="lNow"></div>
    <button class="ldaily" id="lDaily" type="button" hidden></button>
    <div class="psearch">
      <input id="lSearch" type="search" placeholder="搜索电台 / 城市 / 国家" autocomplete="off" aria-label="搜索电台目录">
      <button id="lDiscover" class="discover" type="button" title="发现" aria-label="打开发现页">✦</button>
    </div>
    <div class="pfilters" id="lFilter" role="group" aria-label="电台分类"></div>
    <div class="pbody" id="lBody" role="group" aria-label="电台列表，可用上下方向键移动"></div>
    <div class="pfoot" id="lFoot"><span>公开电台目录</span><span id="lCount">—</span></div>
  </aside>
  <button id="leftTab" class="ptab" type="button" aria-label="展开电台目录">电台目录</button>

  <!-- 右上角竖向一体化播放器：右栏卡片移除后，播放控制与全部功能收敛于此 -->
  <div id="wwPlayer" class="wwpl" data-mode="idle" aria-label="WORLDWAVE 播放器">
    <div class="wwpl-aura" aria-hidden="true"></div>
    <div class="wwpl-main">
      <button class="wwpl-disc" id="plDisc" type="button" aria-label="播放或暂停">
        <span class="wwpl-disc-ring"></span><span class="wwpl-disc-core"></span>
        <span class="wwpl-disc-ico" id="plDiscIco"></span>
      </button>
      <div class="wwpl-txt">
        <div class="wwpl-name" id="plName">WORLDWAVE</div>
        <div class="wwpl-sub"><span id="plState">待机</span><i></i><span id="plCity">点地球上的绿点开始收听</span></div>
      </div>
      <div class="wwpl-eqviz eqviz" id="plEq" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="wwpl-btns">
        <button class="wwpl-b" id="plPrev" type="button" title="上一台" aria-label="上一台"></button>
        <button class="wwpl-b primary" id="plPlay" type="button" title="播放 / 暂停" aria-label="播放或暂停"></button>
        <button class="wwpl-b" id="plNext" type="button" title="随机换一台" aria-label="随机换一台"></button>
        <button class="wwpl-b more" id="plMore" type="button" title="更多功能" aria-label="展开更多功能" aria-expanded="false">⌄</button>
      </div>
    </div>
    <div class="wwpl-track" aria-hidden="true"><span></span></div>
    <div class="wwpl-panel" id="plPanel" hidden></div>
  </div>

  <aside id="stDrawer" class="sdrawer" aria-label="电台详情" aria-hidden="true" hidden>
    <div class="sdhead">
      <button class="sdback" id="sdBack" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="sdtitle" id="sdTitle"></div>
      <button class="sdicon" id="sdFav" type="button" aria-label="收藏"></button>
      <button class="sdicon" id="sdShare" type="button" aria-label="复制链接"></button>
    </div>
    <div class="sdplay">
      <button class="sdmain" id="sdPlay" type="button" aria-label="播放"></button>
      <input id="sdVol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="音量">
      <span class="sdstate" id="sdState"></span>
    </div>
    <div class="sdscroll" id="sdScroll">
      <div class="sdgeo" id="sdGeo"></div>
      <div class="sdbody" id="sdBody"></div>
    </div>
  </aside>

  <script type="module" src="js/earth.js"></script>
  <script src="js/panels.js" defer></script>
  <script src="js/translate.js" defer></script>
  <noscript><div class="ww-fallback">需要启用 JavaScript 才能显示 3D 地球。</div></noscript>
</body>
</html>
